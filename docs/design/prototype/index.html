<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NUSTConnect — Clickable Prototype</title>
<style>
:root{--navy:#173B63;--teal:#14B8A6;--amber:#F59E0B;--bg:#F8FAFC;--surf:#fff;--tx:#1E293B;--tx2:#64748B;--bd:#E2E8F0;--tealL:#D9F5F1;--navyL:#E3EAF3;--amberL:#FEF0D3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:16px}
a{color:inherit;text-decoration:none}[data-go]{cursor:pointer}
h1{font-size:40px;font-weight:700;margin:0}h2{font-size:24px;font-weight:600;margin:0}h3{font-size:18px;font-weight:600;margin:0}.pg{font-size:32px;font-weight:700;color:var(--navy);margin:0}
.sub{color:var(--tx2);font-size:14px}.muted{color:var(--tx2)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:8px;font-weight:600;font-size:14px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--teal);border-color:var(--teal)}.btn.out{background:#fff;color:var(--navy)}.btn.full{width:100%}.btn:hover{filter:brightness(1.12)}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:20px;box-shadow:0 4px 16px rgba(23,59,99,.07)}
.card[data-go]:hover{border-color:var(--teal);box-shadow:0 8px 24px rgba(23,59,99,.15)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tealL);margin-bottom:12px}.ic i{width:20px;height:20px;border-radius:50%;background:var(--teal)}
.ic.a{background:var(--amberL)}.ic.a i{background:var(--amber)}.ic.n{background:var(--navyL)}.ic.n i{background:var(--navy)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--teal);color:#fff}.badge.amb{background:var(--amber);color:var(--tx)}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:8px;font:inherit;font-size:14px;background:#fff}input:focus,textarea:focus,select:focus{outline:2px solid var(--teal)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}.f{margin-bottom:14px}
/* landing */
.top{display:flex;align-items:center;gap:28px;padding:16px 80px;background:#fff;border-bottom:1px solid var(--bd)}.top .sp{flex:1}.top a.l{font-size:14px;color:var(--tx2)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--navy)}.logo span{color:var(--teal);font-weight:400}.logo.d{color:#fff}
.hero{background:var(--navy);color:#fff;padding:80px;display:grid;grid-template-columns:1fr 480px;gap:64px;align-items:center}.hero p{color:#CBD5E1}
.hero .search{background:#fff;border-radius:10px;padding:6px;display:flex}.hero .search input{border:0}
.mini{display:flex;gap:14px;align-items:center;background:#fff;color:var(--tx);border-radius:12px;padding:14px 18px;margin-bottom:12px}.mini small{color:var(--tx2);display:block}
.band{padding:56px 80px}.band.w{background:#fff}.cta{background:var(--tealL);text-align:center;padding:64px}
footer.ft{background:var(--navy);color:#CBD5E1;padding:40px 80px;font-size:13px}
/* app shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sb{background:var(--navy);padding:24px 20px;position:sticky;top:0;height:100vh;overflow:auto}.sb .nv{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:8px;color:#CBD5E1;font-size:14px;margin-bottom:4px}.sb .nv:before{content:"";width:16px;height:16px;border-radius:4px;background:#7E9BC2}
.sb .nv.on{background:var(--teal);color:#fff;font-weight:600}.sb .nv.on:before{background:#fff}.sb .nv:hover{background:rgba(255,255,255,.1)}
.hd{display:flex;gap:16px;align-items:center;padding:14px 32px;background:#fff;border-bottom:1px solid var(--bd)}.hd input{background:var(--bg)}.av{width:36px;height:36px;border-radius:50%;background:var(--teal);flex:none}
.bell{width:38px;height:38px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:var(--bg);flex:none}.bell i{width:14px;height:14px;border-radius:50%;background:var(--amber)}
.ct{padding:32px;display:flex;flex-direction:column;gap:24px}.row{display:flex;gap:16px;align-items:center}.row .g{flex:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:9px 16px;border-radius:20px;border:1px solid var(--bd);background:#fff;font-size:14px;color:var(--tx2);cursor:pointer}.tab.on{background:var(--navy);color:#fff;font-weight:600;border-color:var(--navy)}
.two{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
.ride{display:flex;gap:16px;align-items:center}.ride .p{width:52px;height:52px;border-radius:50%;background:var(--navy);flex:none}
.pimg{height:140px;border-radius:8px;margin-bottom:10px}
.stat b{font-size:32px;color:var(--navy);display:block}
/* auth */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.auth .l{background:var(--navy);color:#fff;padding:80px;display:flex;flex-direction:column;justify-content:center;gap:24px}.auth .r{display:grid;place-items:center;padding:32px}.auth .card{width:480px;padding:40px}
.note{background:#24507F;color:#9FE9E0;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;display:inline-block}
.ok{width:72px;height:72px;border-radius:50%;background:var(--tealL);color:var(--teal);display:grid;place-items:center;font-size:36px;font-weight:700;margin:0 auto}
.proto{background:var(--amberL);border:1px dashed var(--amber);color:#7a4b00;border-radius:10px;padding:10px 14px;font-size:13px}
.flowbar{position:fixed;right:16px;bottom:16px;background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;font-size:12px;z-index:9;opacity:.9}
@media(max-width:900px){.hero,.auth,.two,.grid3,.grid4{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sb{display:none}.top,.band,.hero{padding:24px}h1{font-size:30px}}
</style></head><body>
<div id="root"></div>
<div class="flowbar">NUSTConnect clickable prototype · sample data only · <a href="#/landing" style="text-decoration:underline">restart</a></div>
<script>
const logo=(d)=>`<div class="logo ${d?'d':''}" data-go="${d?'landing':'landing'}"><svg width="32" height="32" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="${d?'#fff':'#173B63'}"/><path d="M14 33 24 14 34 33Z" stroke="${d?'#173B63':'#fff'}" stroke-width="3" stroke-linejoin="round"/><circle cx="14" cy="33" r="5" fill="#14B8A6"/><circle cx="34" cy="33" r="5" fill="#14B8A6"/><circle cx="24" cy="14" r="5" fill="#14B8A6"/></svg><div>NUST<span>Connect</span></div></div>`;
const icon=(c)=>`<div class="ic ${c||''}"><i></i></div>`;
const side=[["Dashboard","dashboard"],["RideShare","rides"],["Marketplace","market"],["Review Hub","reviews"],["Opportunities","soon"],["Campus Map","soon"],["Lost & Found","soon"],["Help Box","soon"],["Complaints","soon"],["Bill Splitting","soon"],["Notifications","soon"],["Settings","soon"]];
const shell=(active,inner)=>`<div class="app"><aside class="sb">${logo(true)}<div style="height:20px"></div>${side.map(([n,r])=>`<div class="nv ${n===active?'on':''}" data-go="${r}">${n}</div>`).join('')}</aside><main><div class="hd"><input placeholder="Search services, rides, items, reviews…"><div class="bell" data-go="soon"><i></i></div><div class="av"></div><b style="font-size:14px;white-space:nowrap">Ahmed Khan</b></div><div class="ct">${inner}</div></main></div>`;
const rideRows=[["Ahmed Khan","Islamabad F-10 → NUST H-12","8:00 AM","2 seats","PKR 250"],["Usman Ali","Rawalpindi Saddar → NUST H-12","8:30 AM","3 seats","PKR 200"],["Hassan Ahmed","Islamabad G-11 → NUST H-12","9:00 AM","1 seat","PKR 180"]];
const prods=[["Scientific Calculator","PKR 2,500","Good condition","Muhammad Ahmed","var(--tealL)"],["Mechanical Keyboard","PKR 4,500","Like new","Ali Raza","var(--navyL)"],["Data Structures Book","PKR 1,200","Good condition","Sara Khan","var(--amberL)"],["Study Table","PKR 3,000","Used","Hamza Malik","var(--navyL)"],["Arduino Starter Kit","PKR 2,800","Like new","Bilal Ahmed","var(--tealL)"],["Computer Mouse","PKR 900","Good condition","Zain Ali","var(--amberL)"]];
const S={
landing:()=>`<div class="top">${logo()}<div class="sp"></div><a class="l" data-go="landing">Home</a><a class="l" data-go="dashboard">Explore Services</a><a class="l" data-go="about">About</a><button class="btn out" data-go="login">Login</button><button class="btn" data-go="register">Register</button></div>
<section class="hero"><div style="display:flex;flex-direction:column;gap:22px"><span class="note" style="width:max-content">For NUST students · Sample prototype</span><h1>One campus. One community. Everything connected.</h1><p>Your university life, simplified. Find rides, explore campus services, discover opportunities and connect with fellow students all in one place.</p><div class="search"><input placeholder="Search rides, items, reviews, services…"></div><div class="row"><button class="btn sec" data-go="dashboard">Explore Services</button><button class="btn out" data-go="register">Get Started</button></div></div>
<div style="background:#24507F;border-radius:20px;padding:28px"><div class="mini">${icon()}<div><b>RideShare</b><small>Islamabad F-10 → NUST H-12 · PKR 250</small></div></div><div class="mini">${icon('a')}<div><b>Marketplace</b><small>Scientific Calculator · PKR 2,500</small></div></div><div class="mini" style="margin:0">${icon('n')}<div><b>Review Hub</b><small>Campus Cafe · ★ 4.0 · Verified Student</small></div></div></div></section>
<section class="band"><h2>Everything you need on campus</h2><p class="muted">One verified student community for the services you use every day.</p><div class="grid3">${[["RideShare","Search, post and request rides with verified students.","","rides"],["Marketplace","Buy, sell and exchange items within campus.","a","market"],["Review Hub","Honest reviews of teachers, cafes, hostels and mess.","n","reviews"],["Campus Map","Facilities and the Freshie Guide.","","soon"],["Opportunities","Internships, alumni referrals and mentorship.","a","soon"],["Student Support","Lost & Found, Help Box and Complaint Tracker.","n","soon"]].map(([a,b,c,r])=>`<div class="card" data-go="${r}">${icon(c)}<h3>${a}</h3><p class="sub">${b}</p></div>`).join('')}</div></section>
<section class="band w"><h2>Popular campus services</h2><div class="grid4" style="margin-top:20px">${["Morning rides to H-12","Used books & electronics","Top rated cafes","Lost & Found board"].map((n,i)=>`<div class="card" style="background:var(--bg)"><div class="pimg" style="background:${['var(--tealL)','var(--amberL)','var(--navyL)','var(--tealL)'][i]}"></div><h3 style="font-size:16px">${n}</h3><span class="sub">Sample campus service</span></div>`).join('')}</div></section>
<section class="band"><h2>How it works</h2><div class="grid3" style="margin-top:20px">${[["1","Register with your NUST email","Verified student access builds a trusted community."],["2","Explore campus services","Rides, marketplace, reviews, maps and more."],["3","Connect and collaborate","Plan trips, split bills and help fellow students."]].map(([n,a,b])=>`<div class="card"><span class="badge" style="background:var(--navy)">${n}</span><h3 style="margin:10px 0 6px">${a}</h3><p class="sub">${b}</p></div>`).join('')}</div></section>
<section class="cta"><h1 style="font-size:32px;color:var(--navy)">Join the student community</h1><p class="muted">Create your account with a NUST email address.</p><button class="btn" data-go="register">Create Account</button></section>
<footer class="ft">${logo(true)}<p>© 2026 NUSTConnect — student design prototype with sample data. Not officially affiliated with or endorsed by NUST.</p></footer>`,
login:()=>`<div class="auth"><div class="l">${logo(true)}<h1 style="font-size:36px">One campus. One community. Everything connected.</h1><p style="color:#CBD5E1">A trusted, verified student community for rides, reviews, marketplace and more.</p><span class="note">✓ Verified NUST community (prototype — no real verification)</span></div><div class="r"><div class="card"><h1 class="pg">Welcome Back</h1><p class="sub">Sign in with your NUST student email to access campus services.</p><div class="f"><label>NUST Email</label><input value="ahmed@students.nust.edu.pk"></div><div class="f"><label>Password</label><input type="password" value="password"></div><div class="row" style="margin-bottom:16px;font-size:13px"><label style="margin:0;font-weight:400" class="g"><input type="checkbox" style="width:auto"> Remember Me</label><a style="color:var(--teal);font-weight:600" data-go="soon">Forgot Password?</a></div><button class="btn full" data-go="dashboard">Sign In</button><p style="text-align:center;font-size:14px" class="muted">New to NUSTConnect? <a data-go="register" style="color:var(--teal);font-weight:600">Register Now</a></p></div></div></div>`,
register:()=>`<div class="auth"><div class="l">${logo(true)}<h1 style="font-size:36px">One campus. One community. Everything connected.</h1><p style="color:#CBD5E1">Institutional email verification builds a trusted student community.</p><span class="note">✓ Verified NUST community (prototype — no real verification)</span></div><div class="r"><div class="card"><h1 class="pg">Join the NUST Community</h1><p class="sub">Institutional email verification is required to keep our community trusted (prototype only).</p>${[["Full Name","Ahmed Khan"],["NUST Email Address","name@students.nust.edu.pk"],["Department / School","SEECS"],["Batch","2023"]].map(([a,b])=>`<div class="f"><label>${a}</label><input value="${b}"></div>`).join('')}<div class="f"><label>Password</label><input type="password" value="password"></div><div class="f"><label>Confirm Password</label><input type="password" value="password"></div><label style="font-weight:400;font-size:13px"><input type="checkbox" style="width:auto" checked> I accept the Terms and Privacy Policy</label><br><button class="btn full" data-go="dashboard">Create Account</button><p style="text-align:center;font-size:14px" class="muted">Already have an account? <a data-go="login" style="color:var(--teal);font-weight:600">Sign In</a></p></div></div></div>`,
dashboard:()=>shell("Dashboard",`<div><h1 class="pg">Welcome back, Ahmed!</h1><p class="muted">Everything happening around your campus, in one place.</p></div>
<div class="grid4">${[["Active Rides",2],["Marketplace Listings",5],["Saved Reviews",12],["Upcoming Events",3]].map(([a,b])=>`<div class="card stat"><span class="sub">${a}</span><b>${b}</b></div>`).join('')}</div>
<h2>Quick Access</h2><div class="grid3">${[["RideShare","Find or post a ride","","rides"],["Marketplace","Buy and sell items","a","market"],["Review Hub","Read student reviews","n","reviews"],["Campus Map","Facilities & Freshie Guide","","soon"],["Opportunities","Internships & referrals","a","soon"],["Student Support","Help Box & complaints","n","soon"]].map(([a,b,c,r])=>`<div class="card" data-go="${r}">${icon(c)}<h3>${a}</h3><p class="sub">${b}</p></div>`).join('')}</div>
<div class="grid3"><div class="card"><h3>Recent Activity</h3><p class="sub">• Ride request sent to Ahmed Khan<br>• Saved review: Campus Cafe<br>• New item: Arduino Starter Kit</p></div><div class="card"><h3>Recommended Opportunities</h3><p class="sub">• Software Engineering Internship<br>• Alumni referral: Data Analyst</p></div><div class="card"><h3>Campus Announcements</h3><p class="sub">• Mid-term schedule released<br>• Library timings extended</p></div></div>`),
rides:()=>shell("RideShare",`<div class="row"><div class="g"><h1 class="pg">Find a Ride</h1><p class="muted">Share your journey and travel smarter with fellow students.</p></div><button class="btn" data-go="soon">Post a Ride</button></div>
<div class="card row" style="align-items:flex-end">${[["From","Islamabad F-10"],["Destination","NUST H-12"],["Travel Date","20 Nov 2026"],["Passengers","1"]].map(([a,b])=>`<div class="g"><label>${a}</label><input value="${b}"></div>`).join('')}<button class="btn">Search Rides</button></div>
<div class="two"><div class="card"><h3 style="margin-bottom:12px">Filters</h3>${["Departure Time","Price Range","Available Seats","Pickup Location"].map(x=>`<div class="f"><label>${x}</label><select><option>Any</option></select></div>`).join('')}</div><div style="display:grid;gap:16px"><h3>3 sample rides available</h3>${rideRows.map(r=>`<div class="card ride"><div class="p"></div><div class="g"><b>${r[0]}</b> <span class="badge">✓ Verified Student</span><div style="color:var(--navy);font-weight:600;margin:4px 0">${r[1]}</div><span class="sub">20 Nov 2026 · ${r[2]} · ${r[3]} available</span></div><div style="text-align:right"><b style="font-size:20px;color:var(--navy)">${r[4]}</b><div class="sub">per passenger</div></div><button class="btn out" data-go="ride">View Details</button></div>`).join('')}<span class="sub">Illustrative prototype records — not real ride offers.</span></div></div>`),
ride:()=>shell("RideShare",`<a class="sub" data-go="rides" style="color:var(--teal);font-weight:600">← Back to Rides</a><div class="row"><div class="g"><h1 class="pg">Islamabad F-10 → NUST H-12</h1><p class="muted">Driver: Ahmed Khan <span class="badge">✓ Verified Student</span></p></div><button class="btn sec" data-go="rideok">Request Seat</button></div>
<div class="grid3"><div class="card"><span class="sub">Departure</span><h3>8:00 AM · 20 November 2026</h3></div><div class="card"><span class="sub">Available seats</span><h3>2</h3></div><div class="card"><span class="sub">Price</span><h3>PKR 250 per passenger</h3></div></div>
<div class="grid3"><div class="card"><h3>Pickup location</h3><p class="sub">F-10 Markaz, Islamabad (sample)</p></div><div class="card"><h3>Destination</h3><p class="sub">NUST H-12 main gate (sample)</p></div><div class="card"><h3>Driver information</h3><p class="sub">Ahmed Khan · BSCS · Batch 2023</p></div></div><div class="card"><h3>Ride description</h3><p class="sub">Daily morning ride to campus. Please be on time. Important travel info: share fuel cost, no smoking.</p></div><div class="proto">Prototype screen — this is not a real or confirmed ride.</div>`),
rideok:()=>shell("RideShare",`<div class="card" style="text-align:center;max-width:620px;margin:40px auto;padding:48px"><div class="ok">✓</div><h1 class="pg" style="font-size:28px;margin:18px 0 8px">Your ride request has been submitted!</h1><p class="muted">Driver: Ahmed Khan<br>Route: Islamabad F-10 → NUST H-12<br>Departure: 8:00 AM · Seats requested: 1 · PKR 250 per passenger</p><div class="proto" style="margin:18px 0">Prototype confirmation — not a real booking.</div><div class="row" style="justify-content:center"><button class="btn" data-go="dashboard">Back to Dashboard</button><button class="btn out" data-go="rides">Explore More Rides</button></div></div>`),
market:()=>shell("Marketplace",`<div class="row"><div class="g"><h1 class="pg">Student Marketplace</h1><p class="muted">Buy, sell and exchange items within your campus community.</p></div><button class="btn" data-go="soon">Post an Item</button></div><input placeholder="Search for items…"><div class="tabs">${["All Items","Electronics","Books","Hostel Essentials","FYP/ESE Hardware","Other"].map((t,i)=>`<span class="tab ${i?'':'on'}">${t}</span>`).join('')}</div>
<div class="two"><div class="card"><h3 style="margin-bottom:12px">Filters</h3>${["Category","Price Range","Item Condition","Availability"].map(x=>`<div class="f"><label>${x}</label><select><option>Any</option></select></div>`).join('')}</div><div class="grid3">${prods.map(p=>`<div class="card"><div class="pimg" style="background:${p[4]}"></div><h3 style="font-size:16px">${p[0]}</h3><b style="color:var(--navy);font-size:18px">${p[1]}</b><p class="sub">${p[2]} · Seller: ${p[3]}</p><button class="btn out full" data-go="${p[0]==='Scientific Calculator'?'product':'product'}">View Details</button></div>`).join('')}</div></div>`),
product:()=>shell("Marketplace",`<a class="sub" data-go="market" style="color:var(--teal);font-weight:600">← Back to Marketplace</a><div class="two" style="grid-template-columns:1fr 1fr"><div class="pimg card" style="height:360px;background:var(--tealL)"></div><div style="display:grid;gap:14px;align-content:start"><h1 class="pg">Scientific Calculator</h1><b style="font-size:28px;color:var(--navy)">PKR 2,500</b><div><span class="badge amb">Condition: Good</span></div><div class="card"><h3>Seller</h3><p class="sub">Muhammad Ahmed <span class="badge">✓ Verified Student</span></p></div><div class="card"><h3>Description</h3><p class="sub">Casio scientific calculator, lightly used for one semester. Works perfectly. Meet on campus.</p></div><button class="btn" data-go="soon">Contact Seller</button><div class="proto">Prototype — no real payment or messaging.</div></div></div>`),
reviews:()=>shell("Review Hub",`<div class="row"><div class="g"><h1 class="pg">Campus Review Hub</h1><p class="muted">Make informed decisions through honest student experiences.</p></div><button class="btn" data-go="write">Write a Review</button></div><div class="tabs">${["Teachers","Cafes","Hostels","Mess","Schools"].map((t,i)=>`<span class="tab ${i?'':'on'}">${t}</span>`).join('')}</div>
<div class="card row" style="align-items:flex-end"><div class="g"><label>Search</label><input placeholder="Search reviews…"></div>${["Category","Rating","Department"].map(x=>`<div class="g"><label>${x}</label><select><option>Any</option></select></div>`).join('')}</div>
<div class="two" style="grid-template-columns:1fr 320px"><div style="display:grid;gap:16px">${[["Great Study Environment","Library","★★★★★ 5/5","Anonymous Student","12 Nov 2026"],["Affordable and Convenient","Campus Cafe","★★★★☆ 4/5","Verified Student","9 Nov 2026"],["Helpful Teaching Staff","Teacher","★★★★½ 4.5/5","Anonymous Student","5 Nov 2026"]].map(r=>`<div class="card"><div class="row"><div class="av" style="background:var(--navyL)"></div><div class="g"><b>${r[3]}</b><div class="sub">${r[4]} · ${r[1]}</div></div><b style="color:var(--amber)">${r[2]}</b></div><h3 style="margin:10px 0 6px">${r[0]}</h3><p class="sub">Sample review excerpt: a short, honest description of the student's experience, kept free of personal information.</p><a style="color:var(--teal);font-weight:600;font-size:14px" data-go="soon">View Review →</a></div>`).join('')}</div><div class="card"><h3 style="margin-bottom:12px">Popular on Campus</h3>${["Central Library","Campus Cafe","Hostel H-2 Mess","Dr. Sample (CS)"].map((x,i)=>`<div class="row" style="margin-bottom:12px">${icon(['','a','n',''][i]).replace('margin-bottom:12px','')}<div><b style="font-size:14px">${x}</b><div class="sub">★ 4.${5-i} · Sample data</div></div></div>`).join('')}</div></div>`),
write:()=>shell("Review Hub",`<div><h1 class="pg">Share Your Experience</h1><p class="muted">Help other students with an honest review.</p></div><div class="card" style="max-width:720px"><div class="f"><label>Category</label><select><option>Teacher</option><option>Cafe</option><option>Hostel</option><option>Mess</option><option>School</option></select></div><div class="f"><label>Rating</label><div style="font-size:28px;color:var(--amber)">★★★★☆</div></div><div class="f"><label>Review title</label><input value="Helpful and approachable"></div><div class="f"><label>Description</label><textarea rows="5">Share your experience in a few sentences…</textarea></div><label style="font-weight:400"><input type="checkbox" style="width:auto" checked> Post anonymously</label><div class="proto" style="margin:14px 0">Privacy: please do not share personal or sensitive information. (Prototype — nothing is saved.)</div><div class="row"><button class="btn" data-go="reviewok">Submit Review</button><button class="btn out" data-go="reviews">Cancel</button></div></div>`),
reviewok:()=>shell("Review Hub",`<div class="card" style="text-align:center;max-width:620px;margin:40px auto;padding:48px"><div class="ok">✓</div><h1 class="pg" style="font-size:28px;margin:18px 0 8px">Thank You for Your Feedback!</h1><p class="muted">Your review has been submitted in this prototype.</p><div class="row" style="justify-content:center;margin-top:20px"><button class="btn" data-go="reviews">Back to Review Hub</button><button class="btn out" data-go="dashboard">Return to Dashboard</button></div></div>`),
about:()=>`<div class="top">${logo()}<div class="sp"></div><button class="btn out" data-go="landing">← Home</button></div><section class="band"><h1 class="pg">About NUSTConnect</h1><p class="muted" style="max-width:760px">A NUST-only student community platform bringing RideShare, Review Hub, Marketplace, Lost & Found, Complaint Tracker, Bill Splitting, Campus Map, Anonymous Help Box, Opportunities, Trips & Meetups and Donations into one verified ecosystem. This is a design prototype with sample data and is not officially affiliated with NUST.</p></section>`,
soon:()=>shell("",`<div class="card" style="max-width:560px;margin:60px auto;text-align:center;padding:48px"><h1 class="pg" style="font-size:26px">Coming in a later design iteration</h1><p class="muted">This module (Opportunities, Campus Map, Lost & Found, Help Box, Complaints, Bill Splitting, Notifications, Settings) is part of the NUSTConnect proposal but not shown in this prototype.</p><button class="btn" data-go="dashboard">Back to Dashboard</button></div>`)
};
function render(){const r=(location.hash.replace('#/','')||'landing');document.getElementById('root').innerHTML=(S[r]||S.landing)();window.scrollTo(0,0);}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){location.hash='#/'+g.dataset.go;}});
window.addEventListener('hashchange',render);render();
</script></body></html>
